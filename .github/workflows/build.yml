name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.CLACK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/clack.keystore"
            echo "CLACK_KEYSTORE_FILE=$RUNNER_TEMP/clack.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::CLACK_KEYSTORE_BASE64 secret is not set; the APK is signed with a throwaway debug key and will not update over a previous install."
          fi

      - name: Test core
        run: ./gradlew :core:test --no-daemon

      - name: Build APK
        env:
          CLACK_KEYSTORE_PASSWORD: ${{ secrets.CLACK_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/clack.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: clack-apk
          path: out/clack.apk

      - name: Publish as the "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Clack 0.1.${{ github.run_number }}
          body: Сборка из ${{ github.sha }}. Скачайте APK ниже и установите поверх предыдущей версии.
          prerelease: false
          make_latest: true
          files: out/clack.apk
