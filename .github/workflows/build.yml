name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.CLACK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/clack.keystore"
            echo "CLACK_KEYSTORE_FILE=$RUNNER_TEMP/clack.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::CLACK_KEYSTORE_BASE64 secret is not set; the APK is signed with a throwaway debug key and will not update over a previous install."
          fi

      - name: Test core
        run: ./gradlew :core:test --no-daemon

      - name: Build APK
        env:
          CLACK_KEYSTORE_PASSWORD: ${{ secrets.CLACK_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Check APK contents
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          unzip -l "$apk" > contents.txt
          for f in assets/dict/ru.tsv assets/dict/en.tsv assets/layouts/russian_jcuken.json assets/layouts/qwerty.json assets/layouts/russian_translit.json assets/alt/titan2.json; do
            grep -qE " ${f}(\.gz)?$" contents.txt || { echo "::error::$f missing from APK"; exit 1; }
          done
          echo "APK size: $(stat -c%s "$apk") bytes"

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/clack.apk
          ls -la out

      - name: Release notes
        run: |
          {
            echo "Что нового:"
            echo
            git log -1 --format=%B | sed '/^Co-Authored-By:/d; /^Claude-Session:/d'
          } > out/notes.md
          cat out/notes.md

      - name: Version file
        run: |
          python3 - <<'PY'
          import json, os
          run = int(os.environ["GITHUB_RUN_NUMBER"])
          repo = os.environ["GITHUB_REPOSITORY"]
          json.dump({
              "versionName": f"0.1.{run}",
              "versionCode": run,
              "notes": open("out/notes.md", encoding="utf-8").read().strip(),
              "apk": f"https://github.com/{repo}/releases/download/latest/clack.apk",
              "size": os.path.getsize("out/clack.apk"),
          }, open("out/version.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          PY
          cat out/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: clack-apk
          path: out/clack.apk

      - name: Publish as the "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Clack 0.1.${{ github.run_number }}
          body_path: out/notes.md
          prerelease: false
          make_latest: true
          files: |
            out/clack.apk
            out/version.json
